$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
body:
  type: json
  content: "{\r

    \  \"email\": \"{{adminEmail}}\",\r

    \  \"password\": \"{{adminPassword}}\"\r

    }"
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: "pm.test('Статус 200', () => {\r

      \  pm.response.to.have.status(200);\r

      });\r

      \ \r

      // Запоминаем токен — его унаследуют все остальные запросы коллекции\r

      pm.collectionVariables.set('token', pm.response.json().token);\r\n"
    language: text/javascript
order: 1959
